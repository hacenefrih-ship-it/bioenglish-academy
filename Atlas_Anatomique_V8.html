let selected=0,cellSelected=0,mode='learn',answers={};const $=id=>document.getElementById(id);

function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim()}
function draw(){
const group=plates[selected];const p=group.subplates?group.subplates[cellSelected]:group;$('menu').replaceChildren();$('subMenu').replaceChildren();if(group.subplates){group.subplates.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o.icon+' '+o.name;b.className=i===cellSelected?'active':'';b.onclick=()=>{cellSelected=i;mode='learn';answers={};draw()};$('subMenu').append(b)})}
plates.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o.icon+' '+o.name;b.className=i===selected?'active':'';b.onclick=()=>{selected=i;cellSelected=0;mode='learn';answers={};draw()};$('menu').append(b)});
